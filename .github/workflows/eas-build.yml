name: EAS Build + Submit TestFlight
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Renouvellement automatique tous les ~80 jours pour éviter l'expiration TestFlight (90 jours)
    # Déclenché le 1er janvier, 22 mars, 10 juin, 29 août, 17 novembre
    - cron: '0 8 1 1 *'
    - cron: '0 8 22 3 *'
    - cron: '0 8 10 6 *'
    - cron: '0 8 29 8 *'
    - cron: '0 8 17 11 *'
jobs:
  build-and-submit:
    name: Build iOS (production) + Submit TestFlight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Installer les dépendances
        run: pnpm install
      - name: Installer EAS CLI
        run: npm install -g eas-cli
      - name: Écrire la clé API Apple
        run: echo "${{ secrets.ASC_API_KEY_P8 }}" > AuthKey_789LA3U89S.p8
      - name: Build iOS (production) + Submit TestFlight
        run: eas build --platform ios --profile production --non-interactive --auto-submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  build-ios-preview:
    name: Build iOS (preview Ad Hoc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Installer les dépendances
        run: pnpm install
      - name: Installer EAS CLI
        run: npm install -g eas-cli
      - name: Build iOS (preview Ad Hoc)
        run: eas build --platform ios --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  build-android:
    name: Build Android (preview APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Installer les dépendances
        run: pnpm install
      - name: Installer EAS CLI
        run: npm install -g eas-cli
      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
